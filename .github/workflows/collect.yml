name: Collect travel times

on:
  schedule:
    # Target cadence is one sample per ~30 min. GitHub's scheduler silently drops
    # runs under load (~50% observed), so we over-schedule at 15-min intervals as
    # insurance. Off-peak minutes chosen to avoid the congested :00/:15/:30/:45 slots.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect travel times
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python collect.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/travel_times.csv
          git commit -m "Add travel time sample $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
